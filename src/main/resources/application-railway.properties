server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.auto_quote_keyword=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=604800000
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.tmdb.api-key=${TMDB_API_KEY:}
app.tmdb.base-url=https://api.themoviedb.org/3
app.tmdb.image-base=https://image.tmdb.org/t/p/w500
app.seed.demo-data=false

spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**