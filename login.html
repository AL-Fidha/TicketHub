<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Sign Up – Ticket Hub</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
</head>
<body class="auth-page">

  <div class="auth-container">

    <!-- Logo -->
    <div class="auth-logo">
      <a href="index.html" style="display:inline-flex;align-items:center;gap:10px;color:inherit;">
        <span style="background:var(--primary);border-radius:8px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;font-size:1.2rem;">🎬</span>
        Ticket<span>Hub</span>
      </a>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">

      <!-- Tabs -->
      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Log In</div>
        <div class="auth-tab" id="tabSignup" onclick="switchTab('signup')">Sign Up</div>
      </div>

      <!-- ── LOGIN FORM ── -->
      <div id="loginForm">
        <div id="loginAlert" class="form-alert error"></div>

        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input class="form-input" type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="input-group">
            <input class="form-input" type="password" id="loginPassword" placeholder="Your password" autocomplete="current-password" />
            <span class="input-icon" onclick="togglePwd('loginPassword', this)">👁️</span>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
          <label class="form-check">
            <input type="checkbox" id="rememberMe" /> Remember me
          </label>
          <a href="#" style="font-size:0.85rem;color:var(--primary-light);">Forgot password?</a>
        </div>

        <button class="btn btn-primary btn-full" onclick="handleLogin()">Log In →</button>

      </div>

      <!-- ── SIGNUP FORM ── -->
      <div id="signupForm" style="display:none;">
        <div id="signupAlert" class="form-alert error"></div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
          <div class="form-group">
            <label class="form-label" for="signupFirst">First Name</label>
            <input class="form-input" type="text" id="signupFirst" placeholder="First" />
          </div>
          <div class="form-group">
            <label class="form-label" for="signupLast">Last Name</label>
            <input class="form-input" type="text" id="signupLast" placeholder="Last" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupEmail">Email Address</label>
          <input class="form-input" type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="signupPhone">Mobile Number</label>
          <input class="form-input" type="tel" id="signupPhone" placeholder="+91 00000 00000" />
        </div>

        <div class="form-group">
          <label class="form-label" for="signupPassword">Password</label>
          <div class="input-group">
            <input class="form-input" type="password" id="signupPassword" placeholder="Min. 6 characters" autocomplete="new-password" />
            <span class="input-icon" onclick="togglePwd('signupPassword', this)">👁️</span>
          </div>
          <div class="form-hint">Use at least 6 characters with a mix of letters and numbers.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signupConfirm">Confirm Password</label>
          <input class="form-input" type="password" id="signupConfirm" placeholder="Repeat password" autocomplete="new-password" />
        </div>

        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" id="agreeTerms" />
            I agree to the <a href="#" style="color:var(--primary-light);">Terms of Service</a> and <a href="#" style="color:var(--primary-light);">Privacy Policy</a>
          </label>
        </div>

        <button class="btn btn-primary btn-full" onclick="handleSignup()">Create Account →</button>
      </div>

    </div>

    <div class="auth-footer">
      <a href="index.html">← Back to Home</a>
    </div>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect if already logged in
      const user = window.TicketHub.getCurrentUser();
      if (user) window.location.href = user.role === 'admin' ? 'dashboard.html' : 'dashboard.html';

      // Allow Enter key on login
      ['loginEmail','loginPassword'].forEach(id => {
        document.getElementById(id).addEventListener('keydown', e => {
          if (e.key === 'Enter') handleLogin();
        });
      });
    });

    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tabLogin').classList.toggle('active', isLogin);
      document.getElementById('tabSignup').classList.toggle('active', !isLogin);
      document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
      document.getElementById('signupForm').style.display = isLogin ? 'none' : 'block';
    }

    function togglePwd(id, icon) {
      const input = document.getElementById(id);
      if (input.type === 'password') { input.type = 'text'; icon.textContent = '🙈'; }
      else { input.type = 'password'; icon.textContent = '👁️'; }
    }

    function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const alert = document.getElementById('loginAlert');

      if (!email || !password) {
        alert.textContent = 'Please enter your email and password.';
        alert.classList.add('show');
        return;
      }

      const result = window.TicketHub.login(email, password);
      if (result.success) {
        window.TicketHub.showToast('Welcome back, ' + result.user.name + '! 👋', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } else {
        alert.textContent = result.message || 'Invalid email or password.';
        alert.classList.add('show');
      }
    }

    function handleSignup() {
      const first = document.getElementById('signupFirst').value.trim();
      const last = document.getElementById('signupLast').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const phone = document.getElementById('signupPhone').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirm = document.getElementById('signupConfirm').value;
      const agree = document.getElementById('agreeTerms').checked;
      const alert = document.getElementById('signupAlert');

      if (!first || !last || !email || !password) {
        alert.textContent = 'Please fill in all required fields.'; alert.classList.add('show'); return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        alert.textContent = 'Please enter a valid email address.'; alert.classList.add('show'); return;
      }
      if (password.length < 6) {
        alert.textContent = 'Password must be at least 6 characters.'; alert.classList.add('show'); return;
      }
      if (password !== confirm) {
        alert.textContent = 'Passwords do not match.'; alert.classList.add('show'); return;
      }
      if (!agree) {
        alert.textContent = 'Please agree to the Terms of Service.'; alert.classList.add('show'); return;
      }
      alert.classList.remove('show');

      const result = window.TicketHub.register({ name: first + ' ' + last, email, phone, password, role: 'customer' });
      if (result.success) {
        window.TicketHub.showToast('Account created! Welcome to Ticket Hub 🎉', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      } else {
        alert.textContent = result.message || 'Registration failed.'; alert.classList.add('show');
      }
    }

  </script>
</body>
</html>
